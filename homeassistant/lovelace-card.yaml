# Markdown card for the Lovelace dashboard.
# Add via: Edit Dashboard -> + Add Card -> Markdown -> paste contents below.

type: markdown
title: Amazon Returns
content: |
  {% set status = states('sensor.amazon_returns_status') %}
  {% set urgent = state_attr('sensor.amazon_returns_urgent', 'urgent_items') or [] %}
  {% set all_items = state_attr('sensor.amazon_returns_urgent', 'all_items') or [] %}
  {% set last = state_attr('sensor.amazon_returns_status', 'last_success') %}

  {% if status == 'login_required' %}
  <ha-alert alert-type="error">Amazon login expired. Run <code>amazon_returns.py --login</code> on the scraper.</ha-alert>
  {% elif status == 'error' %}
  <ha-alert alert-type="warning">Scraper error: {{ state_attr('sensor.amazon_returns_status', 'error') }}</ha-alert>
  {% elif status in ['unavailable', 'unknown'] %}
  <ha-alert alert-type="warning">Can't reach the scraper.</ha-alert>
  {% endif %}

  {% if urgent | length > 0 %}
  ## ⚠️ Due soon
  {% for item in urgent %}
  - **{{ 'TODAY' if item.days_left == 0 else item.days_left ~ 'd left' }}** — [{{ item.title[:80] }}]({{ item.order_url or 'https://www.amazon.com/your-orders/orders' }})
  {% endfor %}

  ---
  {% endif %}

  ### Returnable items ({{ all_items | length }})
  {% for item in all_items %}
  - **{{ item.days_left }}d** ({{ as_datetime(item.return_by).strftime('%b %-d') }}) — [{{ item.title[:70] }}]({{ item.order_url or 'https://www.amazon.com/your-orders/orders' }})
  {% else %}
  *None.*
  {% endfor %}

  *Last successful check: {{ as_timestamp(last) | timestamp_custom('%b %-d, %-I:%M %p') if last else 'never' }}*
